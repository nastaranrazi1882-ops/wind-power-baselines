[project]
name = "wind-power-baselines"
version = "0.1.0"
description = "Public, data-safe wind power point forecasting baseline notebooks."
requires-python = ">=3.10"
dependencies = [
    "jupyter",
    "matplotlib",
    "numpy",
    "openpyxl",
    "pandas",
    "scikit-learn",
    "seaborn",
]

[tool.setuptools.packages.find]
where = ["src"]
